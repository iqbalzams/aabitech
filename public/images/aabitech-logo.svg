<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Glow for Dark Themes -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Mark Left Leg Gradient (Vibrant Cyan to Cobalt) -->
    <linearGradient id="cyanBlueGrad" x1="18" y1="18" x2="52" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Mark Right/Center Ribbon Gradient (Indigo to Vivid Purple) -->
    <linearGradient id="indigoPurpleGrad" x1="38" y1="18" x2="80" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Tech Core Neon Accent Gradient -->
    <linearGradient id="coreNeonGrad" x1="42" y1="38" x2="74" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- 'TECH' Subtitle Gradient -->
    <linearGradient id="techTextGrad" x1="250" y1="40" x2="350" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Icon Symbol -->
  <circle cx="50" cy="48" r="30" fill="#6366F1" opacity="0.22" filter="url(#logoGlow)"/>

  <!-- ==================== ICON EMBLEM ==================== -->
  <!-- Geometric "Double-A / Hextech Delta" Monogram Motif -->
  <g id="logo-symbol" filter="url(#softGlow)">
    <!-- Base Node Glass Plate -->
    <rect x="14" y="14" width="70" height="70" rx="18" fill="#141829" fill-opacity="0.65" stroke="#334155" stroke-width="1.2"/>

    <!-- Left Angular Riser (Outer 'A' Arch) -->
    <path d="M 28 68 L 47 24 C 48.5 20.5 52 20.5 53.5 24 L 72 68" 
          stroke="url(#cyanBlueGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Nested Secondary Chevron / Inner 'A' Dimension Bridge -->
    <path d="M 37 68 L 50 38 L 63 68" 
          stroke="url(#indigoPurpleGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Glowing Circuit Core (Crossbar Intersect) -->
    <line x1="36" y1="55" x2="64" y2="55" 
          stroke="url(#coreNeonGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="url(#softGlow)"/>

    <!-- Floating Quantum Micro-Node (Apex Focus) -->
    <circle cx="50.2" cy="24" r="2.2" fill="#38BDF8"/>
  </g>

  <!-- ==================== BRAND WORDMARK ==================== -->
  <!-- "AABI" Vector Typographic Wordmark -->
  <g id="brand-aabi" filter="url(#softGlow)">
    <!-- First 'A' -->
    <path d="M 112 63 L 123 33 C 123.8 30.8 126.2 30.8 127 33 L 138 63" 
          stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="117" y1="52" x2="133" y2="52" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Second 'A' -->
    <path d="M 148 63 L 159 33 C 159.8 30.8 162.2 30.8 163 33 L 174 63" 
          stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="153" y1="52" x2="169" y2="52" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 'B' (Modern Geometric) -->
    <path d="M 186 33 H 197 C 202.5 33 206 36 206 40 C 206 43.5 203.5 46.5 199 47.5 C 204.5 48.5 207 52 207 56 C 207 60.5 203 63 197 63 H 186 V 33 Z" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="186" y1="47.5" x2="198" y2="47.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

    <!-- 'I' -->
    <line x1="219" y1="33" x2="219" y2="63" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cyan Apex Accent on 'I' -->
    <circle cx="219" cy="27" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- ==================== "TECH" BADGE ==================== -->
  <g id="brand-tech">
    <!-- Sleek Tech Container Pill -->
    <rect x="238" y="32" width="124" height="34" rx="10" 
          fill="#0F172A" 
          stroke="url(#techTextGrad)" 
          stroke-width="1.4" 
          filter="url(#softGlow)"/>

    <!-- Subtle Circuit / Terminal Grid Dots inside Pill -->
    <circle cx="249" cy="49" r="1.5" fill="#38BDF8" opacity="0.6"/>

    <!-- 'T' -->
    <line x1="262" y1="42" x2="274" y2="42" stroke="url(#techTextGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="268" y1="42" x2="268" y2="56" stroke="url(#techTextGrad)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- 'E' -->
    <path d="M 288 42 H 280 V 56 H 288 M 280 49 H 286" 
          stroke="url(#techTextGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'C' -->
    <path d="M 304 44.5 C 302.5 42.8 299.5 42 297 42 C 293 42 291 45 291 49 C 291 53 293 56 297 56 C 299.5 56 302.5 55.2 304 53.5" 
          stroke="url(#techTextGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'H' -->
    <path d="M 312 42 V 56 M 312 49 H 320 M 320 42 V 56" 
          stroke="url(#techTextGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Live Status / Signal Indicator Pulse -->
    <circle cx="343" cy="49" r="3" fill="#22D3EE" filter="url(#softGlow)"/>
    <circle cx="343" cy="49" r="6" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.35"/>
  </g>
</svg>
