<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="ageBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Rose to Indigo) -->
    <linearGradient id="ageBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Calendar Body Gradient -->
    <linearGradient id="calBodyGrad" x1="28" y1="36" x2="68" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Calendar Header (Birth/Date Anchor) Gradient -->
    <linearGradient id="calHeaderGrad" x1="28" y1="36" x2="70" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Hourglass / Life Time Cycle Gradient -->
    <linearGradient id="sandGrad" x1="68" y1="52" x2="104" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Metric Pill Gradient -->
    <linearGradient id="agePillGrad" x1="60" y1="68" x2="104" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ageGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ageSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#8B5CF6" opacity="0.16" filter="url(#ageGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#ageBg)" stroke="url(#ageBorder)" stroke-width="1.5"/>

  <!-- Calendar Base (Birth Date / Reference Day) -->
  <g>
    <!-- Calendar Sheet Base -->
    <rect x="28" y="34" width="42" height="48" rx="8" 
          fill="url(#calBodyGrad)" 
          stroke="#334155" 
          stroke-width="1.3"/>

    <!-- Calendar Top Colored Strip -->
    <path d="M 28 42 C 28 37.5, 31.5 34, 36 34 H 62 C 66.5 34, 70 37.5, 70 42 V 46 H 28 Z" 
          fill="url(#calHeaderGrad)"/>

    <!-- Binder Rings / Pegs -->
    <rect x="36" y="30" width="3" height="7" rx="1.5" fill="#E2E8F0"/>
    <rect x="59" y="30" width="3" height="7" rx="1.5" fill="#E2E8F0"/>

    <!-- Date Matrix Dots inside Calendar -->
    <circle cx="37" cy="54" r="1.6" fill="#64748B"/>
    <circle cx="45" cy="54" r="1.6" fill="#64748B"/>
    <circle cx="53" cy="54" r="1.6" fill="#64748B"/>
    <circle cx="61" cy="54" r="1.6" fill="#64748B"/>

    <circle cx="37" cy="62" r="1.6" fill="#64748B"/>
    <!-- Highlighted Birth Star / Day -->
    <circle cx="45" cy="62" r="2.2" fill="#F43F5E" filter="url(#ageSoftGlow)"/>
    <circle cx="53" cy="62" r="1.6" fill="#64748B"/>
    <circle cx="61" cy="62" r="1.6" fill="#64748B"/>

    <circle cx="37" cy="70" r="1.6" fill="#64748B"/>
    <circle cx="45" cy="70" r="1.6" fill="#64748B"/>
    <circle cx="53" cy="70" r="1.6" fill="#38BDF8"/>
  </g>

  <!-- Circular Passage-of-Time Orbit & Chronometer / Hourglass Ring -->
  <g filter="url(#ageSoftGlow)">
    <!-- Time Ellipse Ring -->
    <circle cx="84" cy="52" r="20" fill="#0B0D17" stroke="#1E293B" stroke-width="2.2"/>
    <!-- Growth / Life Progression Arc -->
    <path d="M 84 32 A 20 20 0 1 1 67 62" 
          stroke="url(#sandGrad)" 
          stroke-width="2.6" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Hourglass Motif inside Dial (Time Elapsed) -->
    <!-- Top bulb -->
    <path d="M 78 43 H 90 L 84 50 Z" stroke="#38BDF8" stroke-width="1.3" fill="#38BDF8" fill-opacity="0.15" stroke-linejoin="round"/>
    <!-- Bottom bulb -->
    <path d="M 84 52 L 90 59 H 78 Z" stroke="#C084FC" stroke-width="1.3" fill="#C084FC" fill-opacity="0.3" stroke-linejoin="round"/>
    <!-- Falling sand particle -->
    <circle cx="84" cy="51" r="0.8" fill="#FFFFFF"/>
  </g>

  <!-- Age Computation Result HUD Badge (Years / Exact Age) -->
  <g filter="url(#ageSoftGlow)">
    <rect x="56" y="70" width="50" height="26" rx="8" 
          fill="#0B0D17" 
          stroke="url(#agePillGrad)" 
          stroke-width="1.8"/>

    <!-- Handcrafted Digital Vector "25" (Years) -->
    <!-- Digit 2 -->
    <path d="M 64 77.5 C 64 75.8, 66 75.5, 67.5 76.5 C 68.5 77.5, 68.5 78.8, 67 80.5 L 64 85 L 70 85" 
          stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Digit 5 -->
    <path d="M 77 75.5 H 73 V 79.5 C 73 79.5, 74 78.8, 75.5 78.8 C 76.8 78.8, 77.6 79.8, 77.6 81.2 C 77.6 82.8, 76.4 84, 74.8 84 C 73.8 84, 73.2 83.5, 73 82.8" 
          stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Unit Label Vector: "YRS" -->
    <!-- Letter Y -->
    <path d="M 83 77.5 L 85 81 V 84.5 M 87 77.5 L 85 81" 
          stroke="#F472B6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter R -->
    <path d="M 89.5 84.5 V 77.5 H 92 C 93 77.5, 93.5 78.5, 93.5 79.5 C 93.5 80.5, 93 81.2, 92 81.2 H 89.5 M 92 81.2 L 93.8 84.5" 
          stroke="#F472B6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accent (Birthday / Milestone Flare) -->
  <path d="M 98 24 
           Q 98 28, 102 28 
           Q 98 28, 98 32 
           Q 98 28, 94 28 
           Q 98 28, 98 24 Z" 
        fill="#F43F5E" 
        filter="url(#ageSoftGlow)"/>
</svg>
