<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="arBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Indigo to Sky Blue) -->
    <linearGradient id="arBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Primary Screen Frame Gradient -->
    <linearGradient id="frameGrad" x1="28" y1="36" x2="98" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Diagonal Lock Vector Gradient -->
    <linearGradient id="diagGrad" x1="30" y1="80" x2="96" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Dimension Arrow Gradient -->
    <linearGradient id="dimArrowGrad" x1="32" y1="89" x2="96" y2="89" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="arGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="arSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#3B82F6" opacity="0.16" filter="url(#arGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#arBg)" stroke="url(#arBorder)" stroke-width="1.5"/>

  <!-- Inner Proportional Frame (16:9 Screen Format) -->
  <rect x="30" y="38" width="66" height="42" rx="6" 
        fill="#1E293B" 
        fill-opacity="0.5" 
        stroke="url(#frameGrad)" 
        stroke-width="2.2" 
        filter="url(#arSoftGlow)"/>

  <!-- Secondary Proportional Comparison Overlay (4:3 Frame Guide) -->
  <rect x="30" y="38" width="56" height="42" rx="4" 
        stroke="#64748B" 
        stroke-width="1.2" 
        stroke-dasharray="2 3" 
        fill="none" 
        opacity="0.6"/>

  <!-- Screen Stand Base Indicator -->
  <path d="M 57 80 L 59 86 L 67 86 L 69 80" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="55" y1="86" x2="71" y2="86" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Diagonal Proportional Lock Line (Corner to Corner) -->
  <line x1="30" y1="80" x2="96" y2="38" stroke="url(#diagGrad)" stroke-width="1.6" stroke-dasharray="3 2" opacity="0.75"/>

  <!-- Horizontal Dimension Indicator (Width Arrow: W) -->
  <path d="M 34 32 L 92 32 M 38 29 L 33 32 L 38 35 M 88 29 L 93 32 L 88 35" 
        stroke="#38BDF8" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>

  <!-- Vertical Dimension Indicator (Height Arrow: H) -->
  <path d="M 102 42 L 102 76 M 99 46 L 102 41 L 105 46 M 99 72 L 102 77 L 105 72" 
        stroke="#818CF8" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>

  <!-- 16:9 Ratio Badge (Floating Pill in Center) -->
  <g filter="url(#arSoftGlow)">
    <rect x="47" y="52" width="32" height="14" rx="4" fill="#0B0D17" stroke="#38BDF8" stroke-width="1.2"/>
    
    <!-- Vector "1" -->
    <line x1="52.5" y1="56.5" x2="54" y2="55" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="54" y1="55" x2="54" y2="62" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Vector "6" -->
    <path d="M 60 55.5 C 58.5 56.5, 57.5 58, 57.5 60 C 57.5 61.5, 58.5 62.5, 60 62.5 C 61.2 62.5, 62 61.5, 62 60 C 62 58.8, 61.2 58, 60 58 C 58.8 58, 58 58.8, 57.7 59.8" 
          stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Vector Colon ":" -->
    <circle cx="64" cy="57" r="0.8" fill="#F43F5E"/>
    <circle cx="64" cy="61" r="0.8" fill="#F43F5E"/>

    <!-- Vector "9" -->
    <path d="M 67.5 60.5 C 68.7 60.5, 69.5 59.7, 69.5 58.5 C 69.5 57.3, 68.7 56.5, 67.5 56.5 C 66.2 56.5, 65.5 57.5, 65.5 59 C 65.5 61, 66.5 62.5, 68 62.5" 
          stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Proportional Lock Icon Accent (Top-Left) -->
  <g filter="url(#arSoftGlow)">
    <circle cx="28" cy="27" r="7" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
    <!-- Lock shackle & body -->
    <path d="M 26.5 26.5 V 25 C 26.5 24, 29.5 24, 29.5 25 V 26.5" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <rect x="25.5" y="26.5" width="5" height="4" rx="1" fill="#38BDF8"/>
  </g>
</svg>
