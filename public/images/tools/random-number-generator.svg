<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="rngBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Electric Violet to Cyan) -->
    <linearGradient id="rngBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Isometric Die Top Face Gradient -->
    <linearGradient id="dieTop" x1="36" y1="36" x2="68" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Isometric Die Left Face Gradient -->
    <linearGradient id="dieLeft" x1="36" y1="52" x2="52" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Isometric Die Right Face Gradient -->
    <linearGradient id="dieRight" x1="52" y1="52" x2="68" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glowing Digital Counter Badge Gradient -->
    <linearGradient id="counterBadge" x1="62" y1="62" x2="104" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Shuffle Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="28" y1="34" x2="100" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="rngGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="rngSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#8B5CF6" opacity="0.16" filter="url(#rngGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#rngBg)" stroke="url(#rngBorder)" stroke-width="1.5"/>

  <!-- Range Indicator HUD Track (Min / Max: [1 ... 100]) -->
  <g opacity="0.8">
    <rect x="28" y="28" width="46" height="12" rx="4" fill="#0B0D17" stroke="#334155" stroke-width="1"/>
    <!-- Min "1" vector -->
    <line x1="34" y1="32" x2="35.5" y2="31" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="35.5" y1="31" x2="35.5" y2="37" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Dots divider "..." -->
    <circle cx="41" cy="35" r="0.9" fill="#64748B"/>
    <circle cx="45" cy="35" r="0.9" fill="#64748B"/>
    <circle cx="49" cy="35" r="0.9" fill="#64748B"/>
    <!-- Max "99" vector -->
    <path d="M 57 32.5 C 57 31.8, 55.8 31.8, 55 32.5 C 54.5 33, 55 34, 57 34.5 V 37" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <path d="M 64 32.5 C 64 31.8, 62.8 31.8, 62 32.5 C 61.5 33, 62 34, 64 34.5 V 37" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Shuffle Orbit Path (Randomization Flow) -->
  <path d="M 32 64 C 32 46, 50 34, 70 36 C 88 38, 98 52, 94 68" 
        stroke="url(#orbitGrad)" 
        stroke-width="1.6" 
        stroke-dasharray="3 3" 
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- Shuffle Flow Arrows -->
  <path d="M 94 65 L 94 72 L 87 71" 
        stroke="#EC4899" 
        stroke-width="1.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#rngSoftGlow)"/>

  <!-- Isometric 3D Die (Quantum / Chance Motif) -->
  <g filter="url(#rngSoftGlow)">
    <!-- Top Isometric Face -->
    <polygon points="52,36 68,45 52,54 36,45" fill="url(#dieTop)" stroke="#60A5FA" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Left Isometric Face -->
    <polygon points="36,45 52,54 52,74 36,64" fill="url(#dieLeft)" stroke="#3B82F6" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right Isometric Face -->
    <polygon points="52,54 68,45 68,64 52,74" fill="url(#dieRight)" stroke="#818CF8" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Pips / Dots on Top Face (Center pip) -->
    <ellipse cx="52" cy="45" rx="2.5" ry="1.4" fill="#FFFFFF"/>
    <ellipse cx="44" cy="41" rx="1.8" ry="1" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="60" cy="49" rx="1.8" ry="1" fill="#FFFFFF" opacity="0.8"/>

    <!-- Pips on Right Face -->
    <circle cx="58" cy="60" r="1.6" fill="#E0E7FF"/>
    <circle cx="62" cy="67" r="1.6" fill="#E0E7FF"/>

    <!-- Pips on Left Face -->
    <circle cx="42" cy="56" r="1.5" fill="#93C5FD"/>
    <circle cx="46" cy="64" r="1.5" fill="#93C5FD"/>
  </g>

  <!-- Generated Number Odometer HUD Badge (High-Tech Result Pill) -->
  <g filter="url(#rngSoftGlow)">
    <rect x="62" y="60" width="46" height="30" rx="9" fill="#0B0D17" stroke="url(#counterBadge)" stroke-width="1.8"/>

    <!-- Shuffle / Random Icon Vector Inside Badge -->
    <g opacity="0.85">
      <path d="M 69 70 L 73 74 L 69 78" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 74 74 H 71" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Lucky / Generated Vector Digits "7" "3" -->
    <!-- Digit 7 -->
    <path d="M 80 69 H 88 L 83 82" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Digit 3 -->
    <path d="M 92 70 H 98 L 94.5 74.5 C 96.5 74.5, 98.5 75.8, 98.5 78 C 98.5 80.5, 96.5 82, 93 82" 
          stroke="#F472B6" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Binary / Entropy Matrix Bits Accent (Bottom-Left) -->
  <g opacity="0.6">
    <circle cx="31" cy="79" r="1.4" fill="#38BDF8"/>
    <circle cx="37" cy="79" r="1.4" fill="#38BDF8" opacity="0.3"/>
    <circle cx="43" cy="79" r="1.4" fill="#38BDF8"/>
    <circle cx="31" cy="85" r="1.4" fill="#38BDF8" opacity="0.3"/>
    <circle cx="37" cy="85" r="1.4" fill="#38BDF8"/>
    <circle cx="43" cy="85" r="1.4" fill="#38BDF8" opacity="0.3"/>
  </g>

  <!-- Sparkling Randomization Flare (Top-Right) -->
  <path d="M 100 22 
           Q 100 27, 105 27 
           Q 100 27, 100 32 
           Q 100 27, 95 27 
           Q 100 27, 100 22 Z" 
        fill="#F472B6" 
        filter="url(#rngSoftGlow)"/>

  <circle cx="89" cy="22" r="1.5" fill="#38BDF8"/>
</svg>
