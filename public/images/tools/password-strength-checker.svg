<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="pwdBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Emerald to Cyan & Violet) -->
    <linearGradient id="pwdBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Shield Outline Gradient -->
    <linearGradient id="shieldGrad" x1="36" y1="28" x2="92" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Lock Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="52" y1="36" x2="76" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="pwdGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pwdSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#10B981" opacity="0.16" filter="url(#pwdGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#pwdBg)" stroke="url(#pwdBorder)" stroke-width="1.5"/>

  <!-- Central Security Shield Frame -->
  <path d="M 64 28
           C 78 28, 91 32, 91 43
           C 91 66, 76 83, 64 91
           C 52 83, 37 66, 37 43
           C 37 32, 50 28, 64 28 Z"
        fill="#1E293B"
        fill-opacity="0.35"
        stroke="url(#shieldGrad)"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Central Padlock Motif -->
  <!-- Padlock Shackle -->
  <path d="M 54 49 V 42 C 54 36.5, 58.5 32, 64 32 C 69.5 32, 74 36.5, 74 42 V 49" 
        stroke="url(#shackleGrad)" 
        stroke-width="3" 
        stroke-linecap="round"
        fill="none"/>

  <!-- Padlock Body -->
  <rect x="49" y="49" width="30" height="22" rx="5" 
        fill="#0B0D17" 
        stroke="#34D399" 
        stroke-width="1.8" 
        filter="url(#pwdSoftGlow)"/>

  <!-- Keyhole Core with Verified Checkmark -->
  <path d="M 59 59.5 L 62.5 63 L 69 56.5" 
        stroke="#34D399" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#pwdSoftGlow)"/>

  <!-- Masked Password Characters Strip (Bullets) -->
  <g opacity="0.85">
    <circle cx="48" cy="79" r="2.2" fill="#94A3B8"/>
    <circle cx="56" cy="79" r="2.2" fill="#94A3B8"/>
    <circle cx="64" cy="79" r="2.2" fill="#38BDF8"/>
    <circle cx="72" cy="79" r="2.2" fill="#34D399"/>
    <circle cx="80" cy="79" r="2.2" fill="#34D399"/>
  </g>

  <!-- Multi-tier Strength Progress Meter Bars -->
  <!-- Bar 1: Weak (Passed) -->
  <rect x="36" y="86" width="12" height="3.5" rx="1.75" fill="#EF4444"/>
  <!-- Bar 2: Fair (Passed) -->
  <rect x="50" y="86" width="12" height="3.5" rx="1.75" fill="#F59E0B"/>
  <!-- Bar 3: Good (Passed) -->
  <rect x="64" y="86" width="12" height="3.5" rx="1.75" fill="#38BDF8"/>
  <!-- Bar 4: Strong (Active / Shielded) -->
  <rect x="78" y="86" width="14" height="3.5" rx="1.75" fill="#10B981" filter="url(#pwdSoftGlow)"/>

  <!-- Top-Right Security Sparkle / Fortified Glint -->
  <path d="M 98 22 
           Q 98 26, 102 26 
           Q 98 26, 98 30 
           Q 98 26, 94 26 
           Q 98 26, 98 22 Z" 
        fill="#34D399" 
        filter="url(#pwdSoftGlow)"/>

  <!-- Top-Left Biometric / Entropy Indicator Accent -->
  <circle cx="29" cy="29" r="2.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="29" cy="29" r="5.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" fill="none"/>
</svg>
