<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="slmBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Laravel Red to Cyan & Violet) -->
    <linearGradient id="slmBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- SQL Cylindrical Database Gradient -->
    <linearGradient id="dbDiskGrad" x1="24" y1="28" x2="56" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Laravel Migration Geometric Cube Gradient -->
    <linearGradient id="larTop" x1="68" y1="36" x2="102" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4433"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="larLeft" x1="68" y1="52" x2="85" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="larRight" x1="85" y1="52" x2="102" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Transformation Flow Connector Gradient -->
    <linearGradient id="transFlow" x1="48" y1="46" x2="72" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2D20"/>
    </linearGradient>

    <!-- Schema Pill Gradient -->
    <linearGradient id="schemaPillGrad" x1="24" y1="76" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2D20"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="slmGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="slmSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#FF2D20" opacity="0.14" filter="url(#slmGlow)"/>

  <!-- Base Glassmorphic Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#slmBg)" stroke="url(#slmBorder)" stroke-width="1.5"/>

  <!-- ================= SQL Database Stack (Origin: Left) ================= -->
  <g filter="url(#slmSoftGlow)">
    <!-- Bottom Disc -->
    <path d="M 28 55 C 28 58.5, 36.5 61, 47 61 C 57.5 61, 66 58.5, 66 55 V 60 C 66 63.5, 57.5 66, 47 66 C 36.5 66, 28 63.5, 28 60 Z" 
          fill="url(#dbDiskGrad)" stroke="#38BDF8" stroke-width="1.1"/>
    
    <!-- Middle Disc -->
    <path d="M 28 46 C 28 49.5, 36.5 52, 47 52 C 57.5 52, 66 49.5, 66 46 V 51 C 66 54.5, 57.5 57, 47 57 C 36.5 57, 28 54.5, 28 51 Z" 
          fill="url(#dbDiskGrad)" stroke="#38BDF8" stroke-width="1.1"/>

    <!-- Top Cylinder Cap -->
    <path d="M 28 37 C 28 40.5, 36.5 43, 47 43 C 57.5 43, 66 40.5, 66 37 V 42 C 66 45.5, 57.5 48, 47 48 C 36.5 48, 28 45.5, 28 42 Z" 
          fill="#0F172A" stroke="#38BDF8" stroke-width="1.1"/>
    <ellipse cx="47" cy="37" rx="19" ry="5.5" fill="#1E293B" stroke="#60A5FA" stroke-width="1.3"/>

    <!-- Disc Status Node -->
    <circle cx="35" cy="51" r="1.2" fill="#38BDF8"/>
    <circle cx="35" cy="60" r="1.2" fill="#38BDF8"/>
  </g>

  <!-- ================= Transformation Bridge ================= -->
  <g filter="url(#slmSoftGlow)">
    <!-- Upper Flow Wave -->
    <path d="M 58 41 C 63 38, 68 44, 73 41" 
          stroke="url(#transFlow)" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Transformation Arrow Vector -->
    <path d="M 60 50 L 73 50 M 70 47 L 73.5 50 L 70 53" 
          stroke="#F87171" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ================= Laravel Migration Isometric Cube (Target: Right) ================= -->
  <g filter="url(#slmSoftGlow)">
    <!-- Top Face -->
    <polygon points="85,34 99,41 85,48 71,41" fill="url(#larTop)" stroke="#FF6B6B" stroke-width="1" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="71,41 85,48 85,65 71,58" fill="url(#larLeft)" stroke="#EF4444" stroke-width="1" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="85,48 99,41 99,58 85,65" fill="url(#larRight)" stroke="#DC2626" stroke-width="1" stroke-linejoin="round"/>

    <!-- Laravel Inner Chevron / Origami Fold Mark -->
    <path d="M 77 48 L 85 53 L 93 48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- ================= Generated Migration Code HUD (Bottom Banner) ================= -->
  <g filter="url(#slmSoftGlow)">
    <rect x="24" y="74" width="80" height="24" rx="7" fill="#0B0D17" stroke="url(#schemaPillGrad)" stroke-width="1.4"/>

    <!-- PHP / Eloquent Terminal Prompt '$table->' -->
    <g opacity="0.95">
      <!-- Dollar Sign '$' -->
      <path d="M 31 82 C 30.5 81.5, 29.5 81.5, 29.5 82.5 C 29.5 83.8, 31.5 83.5, 31.5 84.8 C 31.5 85.8, 30.5 85.8, 30 85.3 M 30.5 81 V 86.5" 
            stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
      
      <!-- 'table' abbreviated token -->
      <line x1="34" y1="81.5" x2="38" y2="81.5" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>
      <line x1="36" y1="81.5" x2="36" y2="86" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>

      <!-- Arrow Operator '->' -->
      <path d="M 40.5 84 H 44.5 M 43 82.2 L 45 84 L 43 85.8" 
            stroke="#FF2D20" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Schema::create / Column Blueprint Method Badge -->
    <rect x="49" y="78.5" width="48" height="15" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Code Snippet Vectors: 'id();' & string token -->
    <!-- 'id' -->
    <line x1="54" y1="82" x2="54" y2="88" stroke="#34D399" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 57 88 V 82 C 58.5 82, 60 83, 60 85 C 60 87, 58.5 88, 57 88 Z" stroke="#34D399" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="88" r="0.6" fill="#94A3B8"/>

    <!-- Simulated '$table->timestamps()' row bars -->
    <rect x="66" y="83" width="16" height="2.5" rx="1.25" fill="#38BDF8" opacity="0.85"/>
    <rect x="84" y="83" width="9" height="2.5" rx="1.25" fill="#FF2D20" opacity="0.85"/>
  </g>

  <!-- Laravel Red Glint Flare (Top-Right) -->
  <path d="M 102 21 
           Q 102 25, 106 25 
           Q 102 25, 102 29 
           Q 102 25, 98 25 
           Q 102 25, 102 21 Z" 
        fill="#FF2D20" 
        filter="url(#slmSoftGlow)"/>

  <!-- SQL Cyan Status Pip (Top-Left) -->
  <circle cx="28" cy="27" r="1.8" fill="#38BDF8" opacity="0.8"/>
</svg>
