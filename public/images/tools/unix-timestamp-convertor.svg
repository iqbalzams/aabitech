<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="unixBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Terminal Amber to Sky Blue) -->
    <linearGradient id="unixBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Epoch Gear / Chrono Ring Gradient -->
    <linearGradient id="gearGrad" x1="28" y1="28" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Terminal Prompt Gradient -->
    <linearGradient id="termGrad" x1="24" y1="36" x2="104" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Sync Arrows Gradient -->
    <linearGradient id="syncGrad" x1="44" y1="72" x2="84" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="unixGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="unixSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#F59E0B" opacity="0.14" filter="url(#unixGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#unixBg)" stroke="url(#unixBorder)" stroke-width="1.5"/>

  <!-- Terminal Window / CLI Console Banner -->
  <rect x="25" y="27" width="78" height="24" rx="7" fill="url(#termGrad)" stroke="#334155" stroke-width="1.3"/>
  
  <!-- Terminal Window Control Dots -->
  <circle cx="32" cy="34" r="1.8" fill="#EF4444"/>
  <circle cx="37" cy="34" r="1.8" fill="#F59E0B"/>
  <circle cx="42" cy="34" r="1.8" fill="#10B981"/>

  <!-- CLI Prompt Symbol '$ ' & 'epoch' command vector -->
  <path d="M 33 43.5 L 35.5 45.5 L 33 47.5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vector text: 1970 (Epoch Origin) -->
  <path d="M 40 44 L 41.5 43 V 48" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 44.5 45.5 C 44.5 44, 46.5 43, 47.5 44.5 C 48 45.5, 47.5 47, 45 48 H 48" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50.5 43 H 54 L 52 48" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="57.5" cy="45.5" rx="1.8" ry="2.5" stroke="#38BDF8" stroke-width="1.1"/>

  <!-- Pulsing Console Caret -->
  <rect x="62" y="43" width="2" height="5.5" fill="#F59E0B" filter="url(#unixSoftGlow)"/>

  <!-- Live Seconds Epoch Ticker Badge (Right-aligned inside terminal) -->
  <rect x="76" y="32" width="23" height="14" rx="3.5" fill="#0B0D17" stroke="#F59E0B" stroke-width="1"/>
  <text x="0" y="0" fill="none"/>
  <!-- Mini seconds counter bars -->
  <rect x="80" y="37" width="3" height="4" rx="1" fill="#FDE047"/>
  <rect x="84.5" y="35.5" width="3" height="7" rx="1" fill="#FBBF24"/>
  <rect x="89" y="38" width="3" height="3" rx="1" fill="#F59E0B"/>
  <rect x="93.5" y="36.5" width="2" height="5" rx="0.8" fill="#F59E0B" opacity="0.6"/>

  <!-- Central Unix Gear & High-Precision Chronometer Core -->
  <g filter="url(#unixSoftGlow)">
    <!-- Gear Outer Cog Notches (Machine Unix System Clock) -->
    <circle cx="48" cy="74" r="18" fill="#0B0D17" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Outer Gear Teeth / Ticks -->
    <line x1="48" y1="52" x2="48" y2="55" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="93" x2="48" y2="96" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="74" x2="29" y2="74" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="67" y1="74" x2="70" y2="74" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="32.5" y1="58.5" x2="35" y2="61" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="61" y1="87" x2="63.5" y2="89.5" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32.5" y1="89.5" x2="35" y2="87" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="61" y1="61" x2="63.5" y2="58.5" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Dynamic Chrono Sweep Arc -->
    <path d="M 48 56 A 18 18 0 1 1 30 74" stroke="url(#gearGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Clock Center Pivot & Needles -->
    <circle cx="48" cy="74" r="2.2" fill="#FBBF24"/>
    <line x1="48" y1="74" x2="48" y2="63" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="48" y1="74" x2="57" y2="70" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Bidirectional Conversion Cycle Arrows (Timestamp ⇄ Human Time) -->
  <g filter="url(#unixSoftGlow)">
    <!-- Top Cycle Arrow (Left to Right) -->
    <path d="M 70 65 L 82 65 M 78 61.5 L 82.5 65 L 78 68.5" 
          stroke="#F59E0B" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Bottom Cycle Arrow (Right to Left) -->
    <path d="M 82 82 L 70 82 M 74 78.5 L 69.5 82 L 74 85.5" 
          stroke="#06B6D4" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Human Output Format HUD Badge (Bottom-Right: UTC / Local) -->
  <g filter="url(#unixSoftGlow)">
    <rect x="74" y="69" width="30" height="26" rx="6" fill="#0B0D17" stroke="#06B6D4" stroke-width="1.4"/>
    
    <!-- Mini Wall Calendar Notch -->
    <line x1="81" y1="73" x2="97" y2="73" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Calendar date indicators -->
    <circle cx="83" cy="78" r="1" fill="#94A3B8"/>
    <circle cx="89" cy="78" r="1" fill="#94A3B8"/>
    <circle cx="95" cy="78" r="1" fill="#38BDF8"/>
    <circle cx="83" cy="84" r="1" fill="#94A3B8"/>
    <circle cx="89" cy="84" r="1.3" fill="#F59E0B"/>
    <circle cx="95" cy="84" r="1" fill="#94A3B8"/>
    <circle cx="83" cy="90" r="1" fill="#94A3B8"/>
    <circle cx="89" cy="90" r="1" fill="#94A3B8"/>
    <circle cx="95" cy="90" r="1" fill="#94A3B8"/>
  </g>

  <!-- Fortified Epoch / Terminal Accent Sparkle (Top-Right) -->
  <path d="M 103 20 
           Q 103 24, 107 24 
           Q 103 24, 103 28 
           Q 103 24, 99 24 
           Q 103 24, 103 20 Z" 
        fill="#FBBF24" 
        filter="url(#unixSoftGlow)"/>
</svg>
