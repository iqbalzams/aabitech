<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="lipsumBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Violet to Rose & Indigo) -->
    <linearGradient id="lipsumBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Editorial Monogram Gradient (Classic Drop-Cap 'L') -->
    <linearGradient id="monogramGrad" x1="28" y1="36" x2="62" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Content Prose Lines Gradient -->
    <linearGradient id="proseGrad" x1="62" y1="42" x2="98" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Magic Generation Sparkle Gradient -->
    <linearGradient id="magicGrad" x1="90" y1="18" x2="112" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Layout Sheet Backdrop Gradient -->
    <linearGradient id="sheetGrad" x1="24" y1="28" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="lipsumGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lipsumSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#8B5CF6" opacity="0.16" filter="url(#lipsumGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#lipsumBg)" stroke="url(#lipsumBorder)" stroke-width="1.5"/>

  <!-- Editorial Page Blueprint Layout (Wireframe Sheet) -->
  <rect x="24" y="28" width="62" height="72" rx="7" fill="url(#sheetGrad)" stroke="#334155" stroke-width="1.2"/>

  <!-- Document Header Accent / Section Rule -->
  <rect x="32" y="36" width="22" height="3" rx="1.5" fill="#64748B" opacity="0.8"/>
  <line x1="32" y1="42" x2="78" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- Hero Drop-Cap 'L' (Typographic Lorem Monogram) -->
  <g filter="url(#lipsumSoftGlow)">
    <path d="M 33 48 V 74 H 49" 
          stroke="url(#monogramGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Serif Accent Finials -->
    <line x1="30" y1="48" x2="36" y2="48" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="49" y1="71" x2="49" y2="76" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Flowing Dummy Text Paragraph Rows (Wrapped beside & below Drop-Cap) -->
  <!-- Top Rows (Beside Drop Cap) -->
  <rect x="54" y="50" width="24" height="3.5" rx="1.75" fill="url(#proseGrad)"/>
  <rect x="54" y="58" width="20" height="3.5" rx="1.75" fill="#475569" opacity="0.8"/>
  <rect x="54" y="66" width="22" height="3.5" rx="1.75" fill="#475569" opacity="0.8"/>

  <!-- Full-Width Rows (Below Drop Cap) -->
  <rect x="32" y="78" width="46" height="3.5" rx="1.75" fill="url(#proseGrad)"/>
  <rect x="32" y="86" width="36" height="3.5" rx="1.75" fill="#475569" opacity="0.7"/>
  <rect x="71" y="86" width="7" height="3.5" rx="1.75" fill="#38BDF8" opacity="0.5"/>

  <!-- Generator Controls / Output Token Pill (Paragraph / Count Badge) -->
  <g filter="url(#lipsumSoftGlow)">
    <rect x="68" y="66" width="38" height="26" rx="8" fill="#0B0D17" stroke="#A855F7" stroke-width="1.6"/>
    
    <!-- Mini Paragraph Symbol Vector: ¶ -->
    <path d="M 77 73 H 81.5 V 84 M 80 73 V 84 M 80 73 C 77.5 73, 75 75, 75 77.5 C 75 80, 77.5 82, 80 82" 
          stroke="#C084FC" 
          stroke-width="1.3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Handcrafted "5P" / "TXT" Vector (5 Paragraphs Generated) -->
    <!-- '5' -->
    <path d="M 89.5 74 H 86 V 77.5 C 86 77.5, 87 76.8, 88.2 76.8 C 89.4 76.8, 90.2 77.7, 90.2 79 C 90.2 80.4, 89.2 81.4, 87.8 81.4 C 87 81.4, 86.4 81, 86.2 80.5" 
          stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'P' -->
    <path d="M 94 81.5 V 74 H 97 C 98.5 74, 99.5 75, 99.5 76.5 C 99.5 78, 98.5 79, 97 79 H 94" 
          stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Large Creative Sparkle (Content Generation Magic) -->
  <path d="M 99 22 
           Q 99 30, 107 30 
           Q 99 30, 99 38 
           Q 99 30, 91 30 
           Q 99 30, 99 22 Z" 
        fill="url(#magicGrad)" 
        filter="url(#lipsumSoftGlow)"/>

  <!-- Secondary Mini Glint -->
  <path d="M 87 21 
           Q 87 24.5, 90.5 24.5 
           Q 87 24.5, 87 28 
           Q 87 24.5, 83.5 24.5 
           Q 87 24.5, 87 21 Z" 
        fill="#EC4899" 
        opacity="0.85"/>
</svg>
