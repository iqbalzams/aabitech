<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="b64Bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient -->
    <linearGradient id="b64Border" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Raw Data / Plaintext Gradient (Left side) -->
    <linearGradient id="rawGrad" x1="28" y1="36" x2="56" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Encoded Base64 Gradient (Right side) -->
    <linearGradient id="encodedGrad" x1="72" y1="36" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bi-directional Exchange Arrows Gradient -->
    <linearGradient id="arrowRightGrad" x1="50" y1="52" x2="78" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="arrowLeftGrad" x1="78" y1="76" x2="50" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="b64Glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="b64SoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#06B6D4" opacity="0.16" filter="url(#b64Glow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#b64Bg)" stroke="url(#b64Border)" stroke-width="1.5"/>

  <!-- Left Module: Plaintext / Binary Node (8-bit / Source) -->
  <rect x="26" y="44" width="28" height="40" rx="9" fill="#1E293B" stroke="url(#rawGrad)" stroke-width="1.5"/>
  <!-- Binary / Text Representation Lines -->
  <circle cx="34" cy="54" r="2" fill="#38BDF8"/>
  <circle cx="41" cy="54" r="2" fill="#38BDF8" opacity="0.4"/>
  <circle cx="47" cy="54" r="2" fill="#38BDF8"/>

  <circle cx="34" cy="64" r="2" fill="#38BDF8" opacity="0.4"/>
  <circle cx="41" cy="64" r="2" fill="#38BDF8"/>
  <circle cx="47" cy="64" r="2" fill="#38BDF8" opacity="0.4"/>

  <rect x="32" y="73" width="16" height="3" rx="1.5" fill="#94A3B8" opacity="0.7"/>

  <!-- Right Module: 64-Radix / Encoded Block -->
  <rect x="74" y="44" width="28" height="40" rx="9" fill="#064E3B" fill-opacity="0.3" stroke="url(#encodedGrad)" stroke-width="1.5"/>
  <!-- "64" Vector Motif Inside Right Node -->
  <!-- Glyphs: 6 -->
  <path d="M 85 53 
           C 82.5 53, 81 55, 81 58 
           C 81 61.5, 83 63, 85 63 
           C 87 63, 88.5 61.5, 88.5 59.5 
           C 88.5 57.5, 87 56, 85 56 
           C 83.5 56, 82.5 56.8, 81.8 58" 
        stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glyphs: 4 -->
  <path d="M 95 62 L 95 53 L 90.5 60 L 96.5 60" 
        stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Equal signs '=' padding indicator below 64 -->
  <line x1="82" y1="72" x2="92" y2="72" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <line x1="82" y1="76" x2="92" y2="76" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Conversion / Two-way Flow (Encode & Decode) -->
  <!-- Top Arrow: Encode (Left to Right) -->
  <path d="M 57 56 L 68 56 M 65 52.5 L 68.5 56 L 65 59.5" 
        stroke="url(#arrowRightGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#b64SoftGlow)"/>

  <!-- Bottom Arrow: Decode (Right to Left) -->
  <path d="M 71 72 L 60 72 M 63 68.5 L 59.5 72 L 63 75.5" 
        stroke="url(#arrowLeftGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#b64SoftGlow)"/>

  <!-- Floating Digital Node Accent (Top-Right) -->
  <circle cx="102" cy="28" r="3" fill="#34D399" filter="url(#b64SoftGlow)"/>
  <circle cx="102" cy="28" r="6" stroke="#34D399" stroke-opacity="0.35" stroke-width="1"/>
</svg>
