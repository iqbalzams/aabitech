<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="dlrBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Rose to Cyan) -->
    <linearGradient id="dlrBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Retained / Unique Line Gradient -->
    <linearGradient id="keptLineGrad" x1="32" y1="46" x2="72" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Duplicate / Strikethrough Row Gradient -->
    <linearGradient id="dupLineGrad" x1="32" y1="62" x2="68" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Deduplication Filter Funnel / Cleanse Gradient -->
    <linearGradient id="cleanBadgeGrad" x1="72" y1="52" x2="104" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="dlrGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dlrSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#F43F5E" opacity="0.14" filter="url(#dlrGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#dlrBg)" stroke="url(#dlrBorder)" stroke-width="1.5"/>

  <!-- Source List / Document Outline Guide -->
  <rect x="26" y="28" width="54" height="72" rx="8" fill="#1E293B" fill-opacity="0.3" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- ROW 1: Unique Item A (Kept - Verified check) -->
  <g id="row-1">
    <circle cx="34" cy="42" r="3" fill="#10B981"/>
    <path d="M 32.5 42 L 33.5 43 L 35.5 41" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="39.5" width="28" height="5" rx="2.5" fill="url(#keptLineGrad)"/>
  </g>

  <!-- ROW 2: Duplicate Item A (Flagged & Deleted with Strikethrough) -->
  <g id="row-2" opacity="0.85">
    <!-- Duplicate Marker (X icon) -->
    <circle cx="34" cy="56" r="3.2" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
    <path d="M 32.5 54.5 L 35.5 57.5 M 35.5 54.5 L 32.5 57.5" stroke="#F87171" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Faded Duplicate Content Bar -->
    <rect x="42" y="53.5" width="28" height="5" rx="2.5" fill="url(#dupLineGrad)"/>
    <!-- Laser / Strike Line across duplicate -->
    <line x1="39" y1="56" x2="74" y2="56" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round" filter="url(#dlrSoftGlow)"/>
  </g>

  <!-- ROW 3: Unique Item B (Kept) -->
  <g id="row-3">
    <circle cx="34" cy="70" r="3" fill="#10B981"/>
    <path d="M 32.5 70 L 33.5 71 L 35.5 69" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="67.5" width="22" height="5" rx="2.5" fill="url(#keptLineGrad)"/>
  </g>

  <!-- ROW 4: Duplicate Item B (Flagged & Deleted with Strikethrough) -->
  <g id="row-4" opacity="0.85">
    <circle cx="34" cy="84" r="3.2" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
    <path d="M 32.5 82.5 L 35.5 85.5 M 35.5 82.5 L 32.5 85.5" stroke="#F87171" stroke-width="1" stroke-linecap="round"/>
    <rect x="42" y="81.5" width="22" height="5" rx="2.5" fill="url(#dupLineGrad)"/>
    <line x1="39" y1="84" x2="68" y2="84" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round" filter="url(#dlrSoftGlow)"/>
  </g>

  <!-- Action Shield / Purge & Clean HUD Badge (Floating Bottom-Right) -->
  <g filter="url(#dlrSoftGlow)">
    <rect x="74" y="60" width="34" height="34" rx="10" fill="#0B0D17" stroke="url(#cleanBadgeGrad)" stroke-width="1.6"/>
    
    <!-- Deduplicate Funnel / Filter Blades -->
    <!-- Funnel / Filter Top -->
    <path d="M 83 69 L 99 69 L 93 76 L 93 82 L 89 84 L 89 76 Z" 
          stroke="#10B981" 
          stroke-width="1.5" 
          stroke-linejoin="round" 
          fill="#10B981" 
          fill-opacity="0.15"/>
    
    <!-- Sparkle / Clean Token inside Funnel -->
    <circle cx="91" cy="73" r="1.5" fill="#34D399"/>
  </g>

  <!-- Remove Indicator / Minus Badge (Top-Right) -->
  <g filter="url(#dlrSoftGlow)">
    <circle cx="98" cy="32" r="7" fill="#1E293B" stroke="#F43F5E" stroke-width="1.4"/>
    <line x1="94.5" y1="32" x2="101.5" y2="32" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
