<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="urlBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Electric Violet & Sky Blue) -->
    <linearGradient id="urlBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Link Ring Left Gradient -->
    <linearGradient id="linkLeftGrad" x1="28" y1="42" x2="56" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Link Ring Right Gradient -->
    <linearGradient id="linkRightGrad" x1="68" y1="52" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Percent Badge / Escape Gradient -->
    <linearGradient id="pctGrad" x1="84" y1="20" x2="110" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Arrows Transfer Gradient -->
    <linearGradient id="arrowLoopGrad" x1="36" y1="92" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="urlGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="urlSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#8B5CF6" opacity="0.16" filter="url(#urlGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#urlBg)" stroke="url(#urlBorder)" stroke-width="1.5"/>

  <!-- Central URL Chain / Hyperlink Motif -->
  <!-- Left Link Loop -->
  <path d="M 52 46 
           L 44 46 
           C 36 46, 30 52, 30 60 
           C 30 68, 36 74, 44 74 
           L 52 74" 
        stroke="url(#linkLeftGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#urlSoftGlow)"/>

  <!-- Right Link Loop -->
  <path d="M 74 46 
           L 82 46 
           C 90 46, 96 52, 96 60 
           C 96 68, 90 74, 82 74 
           L 74 74" 
        stroke="url(#linkRightGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#urlSoftGlow)"/>

  <!-- Interlocking Center Connection Bar -->
  <line x1="46" y1="60" x2="80" y2="60" stroke="#E2E8F0" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Bidirectional Conversion Cycle (Encode ⇄ Decode) -->
  <!-- Top Cycle Arrow (Left to Right: URL String to %XX Encoded) -->
  <path d="M 44 35 L 72 35 M 68 31 L 73 35 L 68 39" 
        stroke="#38BDF8" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>

  <!-- Bottom Cycle Arrow (Right to Left: Decode back to Clean URL) -->
  <path d="M 82 85 L 54 85 M 58 81 L 53 85 L 58 89" 
        stroke="#A855F7" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>

  <!-- URL Percent-Encoding Badge (%20 Tag in Top-Right) -->
  <g filter="url(#urlSoftGlow)">
    <rect x="80" y="22" width="30" height="20" rx="6" fill="#1E1B4B" stroke="url(#pctGrad)" stroke-width="1.4"/>
    
    <!-- Percent Symbol '%' -->
    <!-- Top-left tiny circle -->
    <circle cx="88" cy="28.5" r="1.5" stroke="#F472B6" stroke-width="1.2" fill="none"/>
    <!-- Slash -->
    <line x1="94" y1="27" x2="87" y2="37" stroke="#F472B6" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Bottom-right tiny circle -->
    <circle cx="93" cy="35.5" r="1.5" stroke="#F472B6" stroke-width="1.2" fill="none"/>
    
    <!-- Binary/Hex Code Dots (representing '20' or encoded bytes) -->
    <rect x="99" y="28" width="4" height="2" rx="1" fill="#C084FC"/>
    <rect x="99" y="32" width="6" height="2" rx="1" fill="#C084FC" opacity="0.7"/>
    <rect x="99" y="36" width="3" height="2" rx="1" fill="#C084FC" opacity="0.5"/>
  </g>

  <!-- Accent Status Dot (Bottom-Left) -->
  <circle cx="28" cy="88" r="2.5" fill="#38BDF8" opacity="0.6"/>
</svg>
