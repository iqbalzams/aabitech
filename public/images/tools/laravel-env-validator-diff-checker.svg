<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="envBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Laravel Red to Emerald & Sky Blue) -->
    <linearGradient id="envBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <!-- .env File Pane Gradient (Left: Live / Modified) -->
    <linearGradient id="fileEnvGrad" x1="26" y1="30" x2="58" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- .env.example File Pane Gradient (Right: Baseline) -->
    <linearGradient id="fileExamGrad" x1="70" y1="30" x2="102" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Compare / Diff Connector Gradient -->
    <linearGradient id="diffArrowGrad" x1="56" y1="48" x2="72" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF2D20"/>
    </linearGradient>

    <!-- Diff Result Banner Gradient -->
    <linearGradient id="diffBannerGrad" x1="24" y1="76" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF2D20"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="envGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="envSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#FF2D20" opacity="0.14" filter="url(#envGlow)"/>

  <!-- Base Glassmorphic Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#envBg)" stroke="url(#envBorder)" stroke-width="1.5"/>

  <!-- ================= Left File: .env (Active Configuration) ================= -->
  <g filter="url(#envSoftGlow)">
    <!-- Sheet Outline -->
    <rect x="25" y="30" width="34" height="42" rx="4" fill="url(#fileEnvGrad)" stroke="#334155" stroke-width="1.1"/>
    
    <!-- Top Colored Tab (Laravel Red Identifier) -->
    <path d="M 25 34 C 25 31.8 26.8 30 29 30 H 42 L 46 34 H 55 C 57.2 34 59 35.8 59 38 V 40 H 25 Z" fill="#FF2D20" fill-opacity="0.85"/>
    
    <!-- File Header Snippet: ".env" -->
    <circle cx="30" cy="35" r="0.9" fill="#FFFFFF"/>
    <line x1="33" y1="35" x2="41" y2="35" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

    <!-- Key-Value Line 1: APP_KEY (Valid / Green) -->
    <rect x="28" y="44" width="10" height="2.2" rx="1.1" fill="#38BDF8"/>
    <rect x="40" y="44" width="15" height="2.2" rx="1.1" fill="#10B981"/>

    <!-- Key-Value Line 2: DB_HOST (Valid / Green) -->
    <rect x="28" y="50" width="8" height="2.2" rx="1.1" fill="#38BDF8"/>
    <rect x="38" y="50" width="12" height="2.2" rx="1.1" fill="#10B981"/>

    <!-- Key-Value Line 3: STRIPE_SECRET (Missing or Extra Diff / Red Highlight) -->
    <rect x="28" y="56" width="14" height="2.2" rx="1.1" fill="#F87171"/>
    <circle cx="47" cy="57.1" r="1.3" fill="#FF2D20"/>

    <!-- Key-Value Line 4: CACHE_STORE -->
    <rect x="28" y="62" width="11" height="2.2" rx="1.1" fill="#64748B" opacity="0.6"/>
    <rect x="41" y="62" width="10" height="2.2" rx="1.1" fill="#64748B" opacity="0.6"/>
  </g>

  <!-- ================= Center Compare / Validation Symbol ================= -->
  <g filter="url(#envSoftGlow)">
    <!-- Bidirectional Comparison Arrows -->
    <path d="M 59 48 L 69 48 M 66 45.5 L 69.5 48 L 66 50.5" 
          stroke="url(#diffArrowGrad)" 
          stroke-width="1.6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 69 54 L 59 54 M 62 51.5 L 58.5 54 L 62 56.5" 
          stroke="url(#diffArrowGrad)" 
          stroke-width="1.6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ================= Right File: .env.example (Baseline Reference) ================= -->
  <g filter="url(#envSoftGlow)">
    <!-- Sheet Outline -->
    <rect x="69" y="30" width="34" height="42" rx="4" fill="url(#fileExamGrad)" stroke="#334155" stroke-width="1.1"/>

    <!-- Top Colored Tab (Slate / Indigo Tag) -->
    <path d="M 69 34 C 69 31.8 70.8 30 73 30 H 86 L 90 34 H 99 C 101.2 34 103 35.8 103 38 V 40 H 69 Z" fill="#475569"/>
    
    <!-- File Header Snippet: ".example" -->
    <circle cx="74" cy="35" r="0.9" fill="#94A3B8"/>
    <line x1="77" y1="35" x2="88" y2="35" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>

    <!-- Key-Value Matching Rows -->
    <rect x="72" y="44" width="10" height="2.2" rx="1.1" fill="#64748B" opacity="0.8"/>
    <rect x="84" y="44" width="14" height="2.2" rx="1.1" fill="#475569" opacity="0.6"/>

    <rect x="72" y="50" width="8" height="2.2" rx="1.1" fill="#64748B" opacity="0.8"/>
    <rect x="82" y="50" width="13" height="2.2" rx="1.1" fill="#475569" opacity="0.6"/>

    <!-- Missing Key Strikethrough / Diff Slot (Red Warning Marker) -->
    <rect x="72" y="56" width="12" height="2.2" rx="1.1" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
    <path d="M 88 55 L 94 59 M 94 55 L 88 59" stroke="#FF2D20" stroke-width="1.2" stroke-linecap="round"/>

    <rect x="72" y="62" width="11" height="2.2" rx="1.1" fill="#64748B" opacity="0.8"/>
    <rect x="85" y="62" width="10" height="2.2" rx="1.1" fill="#475569" opacity="0.6"/>
  </g>

  <!-- ================= Bottom Validation Status HUD ================= -->
  <g filter="url(#envSoftGlow)">
    <rect x="24" y="76" width="80" height="24" rx="7" fill="#0B0D17" stroke="url(#diffBannerGrad)" stroke-width="1.4"/>

    <!-- Verified Green Checkmark (Synced variables) -->
    <circle cx="34" cy="88" r="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.2"/>
    <path d="M 32 88 L 33.5 89.5 L 36.5 86.5" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text Token Display: "1 MISSING" -->
    <!-- '1' -->
    <line x1="43" y1="86" x2="45" y2="85" stroke="#F87171" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="45" y1="85" x2="45" y2="91" stroke="#F87171" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Vector Word "DIFF" / Missing Indicator -->
    <!-- 'D' -->
    <path d="M 50 85 V 91 H 52.5 C 54.5 91, 55.5 89.8, 55.5 88 C 55.5 86.2, 54.5 85, 52.5 85 Z" 
          stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'I' -->
    <line x1="58" y1="85" x2="58" y2="91" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    <!-- 'F' -->
    <path d="M 61 91 V 85 H 65 M 61 88 H 64" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'F' -->
    <path d="M 67 91 V 85 H 71 M 67 88 H 70" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warning / Alert Triangle Badge (Right) -->
    <g transform="translate(86, 83)">
      <path d="M 7 1 L 13.5 12 H 0.5 Z" fill="#FF2D20" fill-opacity="0.25" stroke="#FF2D20" stroke-width="1.2" stroke-linejoin="round"/>
      <line x1="7" y1="4.5" x2="7" y2="7.5" stroke="#FBBF24" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="7" cy="9.8" r="0.6" fill="#FBBF24"/>
    </g>
  </g>

  <!-- Status Glint Sparkle (Top-Right) -->
  <path d="M 102 21 
           Q 102 25, 106 25 
           Q 102 25, 102 29 
           Q 102 25, 98 25 
           Q 102 25, 102 21 Z" 
        fill="#FF2D20" 
        filter="url(#envSoftGlow)"/>

  <!-- Mini Status Sync Dot (Top-Left) -->
  <circle cx="28" cy="26" r="1.8" fill="#10B981" filter="url(#envSoftGlow)"/>
</svg>
