<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cceBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Safety Amber to Blueprint Cyan & Emerald) -->
    <linearGradient id="cceBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Architectural Isometric Skyscraper Gradient -->
    <linearGradient id="bldgLeft" x1="28" y1="40" x2="48" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bldgRight" x1="48" y1="40" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bldgTop" x1="28" y1="32" x2="68" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Construction Crane Tower Gradient -->
    <linearGradient id="craneGrad" x1="68" y1="26" x2="102" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Budget Cost Estimation Banner Gradient -->
    <linearGradient id="costPillGrad" x1="24" y1="76" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cceGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cceSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#F59E0B" opacity="0.15" filter="url(#cceGlow)"/>

  <!-- Base Glassmorphic Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#cceBg)" stroke="url(#cceBorder)" stroke-width="1.5"/>

  <!-- Blueprint Dimension Grid Overlay (Top Canvas) -->
  <g opacity="0.35">
    <line x1="26" y1="36" x2="68" y2="36" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="26" y1="52" x2="68" y2="52" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="38" y1="28" x2="38" y2="68" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="56" y1="28" x2="56" y2="68" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- ================= Left: Isometric Structural Building & Scaffolding ================= -->
  <g filter="url(#cceSoftGlow)">
    <!-- Roof Slab Top Face -->
    <polygon points="46,34 62,41 46,48 30,41" fill="url(#bldgTop)" stroke="#60A5FA" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Left Facade Wall -->
    <polygon points="30,41 46,48 46,70 30,63" fill="url(#bldgLeft)" stroke="#38BDF8" stroke-width="1" stroke-linejoin="round"/>

    <!-- Right Facade Wall -->
    <polygon points="46,48 62,41 62,63 46,70" fill="url(#bldgRight)" stroke="#38BDF8" stroke-width="1" stroke-linejoin="round"/>

    <!-- Blueprint Construction Wireframe Windows (Left Face) -->
    <line x1="35" y1="46" x2="41" y2="49" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="35" y1="52" x2="41" y2="55" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="35" y1="58" x2="41" y2="61" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Architectural Windows (Right Face) -->
    <line x1="51" y1="49" x2="57" y2="46" stroke="#60A5FA" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="51" y1="55" x2="57" y2="52" stroke="#60A5FA" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="51" y1="61" x2="57" y2="58" stroke="#60A5FA" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- ================= Right: Tower Crane & Hoist Payload ================= -->
  <g filter="url(#cceSoftGlow)">
    <!-- Vertical Mast (Lattice Mast Tower) -->
    <line x1="84" y1="28" x2="84" y2="68" stroke="url(#craneGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Mast Cross Bracing -->
    <path d="M 82 34 L 86 38 M 86 34 L 82 38 M 82 44 L 86 48 M 86 44 L 82 48 M 82 54 L 86 58 M 86 54 L 82 58" 
          stroke="#FBBF24" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

    <!-- Horizontal Jib & Counter-Jib Boom -->
    <line x1="68" y1="30" x2="100" y2="30" stroke="url(#craneGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- A-Frame Apex & Guy Ropes -->
    <polygon points="84,24 81,30 87,30" fill="#F59E0B"/>
    <line x1="84" y1="24" x2="72" y2="30" stroke="#FDE047" stroke-width="1" stroke-linecap="round"/>
    <line x1="84" y1="24" x2="98" y2="30" stroke="#FDE047" stroke-width="1" stroke-linecap="round"/>
    <!-- Counterweight -->
    <rect x="94" y="30" width="5.5" height="4.5" rx="1" fill="#D97706"/>

    <!-- Hoist Trolley Cable & Material Hook -->
    <line x1="74" y1="30" x2="74" y2="46" stroke="#94A3B8" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Suspended Construction Payload Block -->
    <rect x="70.5" y="46" width="7" height="6" rx="1.5" fill="#10B981" stroke="#34D399" stroke-width="1"/>
  </g>

  <!-- Ruler Dimension Caliper / Area Measurement Pip (Between Units) -->
  <g opacity="0.85">
    <line x1="62" y1="67" x2="78" y2="67" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="62" y1="65" x2="62" y2="69" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="78" y1="65" x2="78" y2="69" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="70" cy="67" r="1" fill="#FBBF24"/>
  </g>

  <!-- ================= Bottom: Construction Cost Estimate Readout HUD ================= -->
  <g filter="url(#cceSoftGlow)">
    <rect x="24" y="76" width="80" height="24" rx="7" fill="#0B0D17" stroke="url(#costPillGrad)" stroke-width="1.4"/>

    <!-- Currency Symbol: '$' -->
    <path d="M 33.5 84 C 33 83.2, 32.2 82.8, 31.2 82.8 C 30 82.8, 29.5 83.5, 29.5 84.4 C 29.5 85.5, 30.5 85.8, 31.8 86.4 C 33 87, 33.8 87.8, 33.8 89.2 C 33.8 90.4, 32.6 91.2, 31.2 91.2 C 30 91.2, 29.2 90.5, 28.8 89.8" 
          stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="31.2" y1="81.5" x2="31.2" y2="92.5" stroke="#10B981" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Handcrafted Result Vector: "185" (e.g. $185/sq ft) -->
    <!-- '1' -->
    <line x1="37.5" y1="85.5" x2="39" y2="84.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="39" y1="84.5" x2="39" y2="90.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <!-- '8' -->
    <ellipse cx="44.2" cy="86" rx="1.8" ry="1.6" stroke="#FFFFFF" stroke-width="1.2"/>
    <ellipse cx="44.2" cy="89.2" rx="2" ry="1.8" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- '5' -->
    <path d="M 52 84.5 H 48.8 V 87 C 48.8 87, 49.8 86.6, 50.8 86.6 C 51.8 86.6, 52.6 87.2, 52.6 88.5 C 52.6 89.8, 51.6 90.5, 50.4 90.5 C 49.5 90.5, 48.9 90, 48.7 89.5" 
          stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Unit Rate Label Pill: "/SQ FT" -->
    <rect x="57" y="82.5" width="41" height="11" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <!-- '/' -->
    <line x1="62" y1="90.5" x2="64.5" y2="85" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <!-- 'S' -->
    <path d="M 68 85.8 C 67.5 85.2, 66.8 85.2, 66.8 86 C 66.8 87, 68.5 87, 68.5 88 C 68.5 89, 67.5 89, 66.8 88.6" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 'F' -->
    <path d="M 72 89 V 85 H 75 M 72 87 H 74.2" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'T' -->
    <path d="M 77 85 H 80.5 M 78.8 85 V 89" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Calculated Budget Indicator Pulse -->
    <circle cx="86" cy="87.5" r="1.3" fill="#10B981"/>
    <circle cx="92" cy="87.5" r="1.3" fill="#F59E0B"/>
  </g>

  <!-- Construction Safety Amber Sparkle (Top-Right) -->
  <path d="M 102 21 
           Q 102 25, 106 25 
           Q 102 25, 102 29 
           Q 102 25, 98 25 
           Q 102 25, 102 21 Z" 
        fill="#F59E0B" 
        filter="url(#cceSoftGlow)"/>

  <!-- Blueprint Cyan Survey Node (Top-Left) -->
  <circle cx="28" cy="27" r="1.8" fill="#38BDF8" opacity="0.8"/>
</svg>
