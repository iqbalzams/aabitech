<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cgpaBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Indigo to Sky Blue & Emerald) -->
    <linearGradient id="cgpaBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Academic Cap / Slate Gradient -->
    <linearGradient id="capGrad" x1="28" y1="28" x2="68" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Percent Gauge Arc Gradient -->
    <linearGradient id="gaugeArc" x1="68" y1="36" x2="104" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Conversion Ratio Pill Gradient -->
    <linearGradient id="convPillGrad" x1="48" y1="74" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="cgpaGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cgpaSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#6366F1" opacity="0.16" filter="url(#cgpaGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#cgpaBg)" stroke="url(#cgpaBorder)" stroke-width="1.5"/>

  <!-- Top-Left Academic Cap (CGPA / GPA Origin) -->
  <g filter="url(#cgpaSoftGlow)">
    <!-- Mortarboard Rhombus Top -->
    <polygon points="46,30 68,39 46,47 24,39" fill="url(#capGrad)" stroke="#38BDF8" stroke-width="1.3" stroke-linejoin="round"/>
    
    <!-- Skull Cap Underneath -->
    <path d="M 33 43.5 V 50 C 33 55, 59 55, 59 50 V 43.5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Tassel String and Ribbon -->
    <path d="M 46 39.5 C 38 41, 27 46, 26 53" stroke="#FBBF24" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <circle cx="26" cy="54" r="1.5" fill="#FDE047"/>
  </g>

  <!-- Left Input Metric HUD Tag: "9.2 CGPA" -->
  <g filter="url(#cgpaSoftGlow)">
    <rect x="24" y="62" width="38" height="24" rx="6" fill="#0B0D17" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Vector "9.2" Handcrafted Readout -->
    <!-- '9' -->
    <path d="M 34.5 70 C 34.5 68.5, 33 67.5, 31.5 67.5 C 29.8 67.5, 29 68.8, 29 70.5 C 29 72, 30 73, 31.5 73 C 33 73, 34.5 72, 34.5 70 Z M 34.5 68.5 V 74" 
          stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- '.' -->
    <circle cx="36.5" cy="74" r="0.8" fill="#38BDF8"/>
    <!-- '2' -->
    <path d="M 39 69 C 39 68, 40.5 67.5, 41.5 68.2 C 42.2 69, 41.8 70, 39.5 71.5 L 39 74 H 42.5" 
          stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sub-label "CGPA" -->
    <line x1="28" y1="79" x2="35" y2="79" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>
    <line x1="37" y1="79" x2="48" y2="79" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Conversion Transformation Vector (Arrow bridging CGPA to %) -->
  <g filter="url(#cgpaSoftGlow)">
    <path d="M 64 64 L 73 64 M 70 61 L 73.5 64 L 70 67" 
          stroke="#38BDF8" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Scale Factor Indicator / Formula Spark (x9.5) -->
    <path d="M 66 54 L 68 56 M 68 54 L 66 56" stroke="#FBBF24" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="72" cy="55" r="0.8" fill="#FBBF24"/>
  </g>

  <!-- Circular Radial Percentage Arc Gauge (Right) -->
  <g filter="url(#cgpaSoftGlow)">
    <!-- Radial Outer Ring -->
    <circle cx="86" cy="52" r="18" fill="#0B0D17" stroke="#1E293B" stroke-width="2.5"/>
    
    <!-- Percentage Dial Swept Arc (Approx ~87% sweep) -->
    <path d="M 86 34 
             A 18 18 0 1 1 71 63" 
          stroke="url(#gaugeArc)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Dial Core: Prominent Percent Glyph '%' -->
    <line x1="81" y1="57" x2="91" y2="47" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="82.5" cy="48.5" r="1.5" fill="#38BDF8"/>
    <circle cx="89.5" cy="55.5" r="1.5" fill="#34D399"/>
  </g>

  <!-- Bottom Result HUD Pill ("87.4%") -->
  <g filter="url(#cgpaSoftGlow)">
    <rect x="52" y="74" width="52" height="24" rx="7" fill="#0B0D17" stroke="url(#convPillGrad)" stroke-width="1.5"/>

    <!-- Live Status Dot -->
    <circle cx="59" cy="86" r="2" fill="#10B981"/>

    <!-- Handcrafted Result Vector: "87%" -->
    <!-- '8' -->
    <ellipse cx="67" cy="83.2" rx="1.8" ry="1.7" stroke="#FFFFFF" stroke-width="1.2"/>
    <ellipse cx="67" cy="87.5" rx="2" ry="1.9" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- '7' -->
    <path d="M 72.5 81.5 H 77 L 74 91" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- '.' -->
    <circle cx="78.5" cy="90.5" r="0.8" fill="#34D399"/>
    <!-- '4' -->
    <path d="M 83 81.5 L 81 87 H 84.5 M 83.5 84 V 91" stroke="#34D399" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini '%' Suffix -->
    <line x1="88" y1="90" x2="92" y2="83" stroke="#34D399" stroke-width="1" stroke-linecap="round"/>
    <circle cx="88.5" cy="84" r="0.8" fill="#34D399"/>
    <circle cx="91.5" cy="89" r="0.8" fill="#34D399"/>
  </g>

  <!-- Academic Precision Sparkle Accent (Top-Right) -->
  <path d="M 101 22 
           Q 101 26, 105 26 
           Q 101 26, 101 30 
           Q 101 26, 97 26 
           Q 101 26, 101 22 Z" 
        fill="#38BDF8" 
        filter="url(#cgpaSoftGlow)"/>
</svg>
