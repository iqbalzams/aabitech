<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="rtBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Amber to Emerald/Cyan) -->
    <linearGradient id="rtBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Book Cover & Spine Gradient -->
    <linearGradient id="bookGrad" x1="26" y1="38" x2="70" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Reading Progress Dial Gradient -->
    <linearGradient id="dialGrad" x1="60" y1="36" x2="104" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Minutes Badge Pill Gradient -->
    <linearGradient id="badgeGrad" x1="64" y1="72" x2="106" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="rtGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="rtSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#F59E0B" opacity="0.15" filter="url(#rtGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#rtBg)" stroke="url(#rtBorder)" stroke-width="1.5"/>

  <!-- Open Book Silhouette (Article / Read Context) -->
  <g opacity="0.9">
    <!-- Left Page Outline -->
    <path d="M 52 46 
             C 42 43, 30 45, 26 47 
             V 83 
             C 31 81, 42 79, 52 82 
             Z" 
          fill="url(#bookGrad)" 
          stroke="#334155" 
          stroke-width="1.3" 
          stroke-linejoin="round"/>

    <!-- Left Page Text Rows -->
    <line x1="31" y1="55" x2="47" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="31" y1="62" x2="47" y2="59" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="31" y1="69" x2="44" y2="66" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Spine Spine Line -->
    <line x1="52" y1="46" x2="52" y2="82" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- High-Tech Stopwatch / Reading Timer Dial -->
  <g filter="url(#rtSoftGlow)">
    <!-- Dial Track Background -->
    <circle cx="82" cy="56" r="23" fill="#0B0D17" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Stopwatch Crown & Button -->
    <path d="M 82 30 V 33" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="78" y1="30" x2="86" y2="30" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <!-- Side Angled Button -->
    <line x1="97" y1="39" x2="99.5" y2="36.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Time Arc Indicator (Approx 4-5 min reading arc) -->
    <path d="M 82 33 
             A 23 23 0 0 1 104 63" 
          stroke="url(#dialGrad)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Inner Radial Scale Ticks -->
    <circle cx="82" cy="56" r="17" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.7"/>

    <!-- Center Clock Pivot & Hands -->
    <circle cx="82" cy="56" r="2.5" fill="#FDE047"/>
    <!-- Minute Hand (Pointing toward ~4 min) -->
    <line x1="82" y1="56" x2="94" y2="49" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Hour Hand -->
    <line x1="82" y1="56" x2="82" y2="44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Reading Pace / Time Readout HUD Badge (Bottom-Right) -->
  <g filter="url(#rtSoftGlow)">
    <rect x="58" y="74" width="48" height="24" rx="7" fill="#0B0D17" stroke="url(#badgeGrad)" stroke-width="1.6"/>

    <!-- Eyeball / Reading Glyph Vector -->
    <path d="M 64 86 C 66 83, 70 83, 72 86 C 70 89, 66 89, 64 86 Z" stroke="#FBBF24" stroke-width="1.2" fill="none"/>
    <circle cx="68" cy="86" r="1.2" fill="#FBBF24"/>

    <!-- Handcrafted "5 MIN" Readout -->
    <!-- Digit 5 -->
    <path d="M 80 81.5 H 76 V 85 C 76 85, 77 84.3, 78.5 84.3 C 79.8 84.3, 80.5 85.2, 80.5 86.5 C 80.5 87.8, 79.5 88.7, 78 88.7 C 77.1 88.7, 76.5 88.3, 76.2 87.8" 
          stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter M -->
    <path d="M 84 88.5 V 82 L 86.5 85.5 L 89 82 V 88.5" 
          stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter I -->
    <line x1="91.5" y1="82" x2="91.5" y2="88.5" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Letter N -->
    <path d="M 94.5" stroke="none"/>
    <path d="M 94 88.5 V 82 L 97 88.5 V 82" 
          stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speed Metric / WPM Pulse Indicator (Top-Left) -->
  <g opacity="0.8">
    <circle cx="28" cy="28" r="2" fill="#10B981" filter="url(#rtSoftGlow)"/>
    <path d="M 33 28 L 36 28 L 38 25 L 40 31 L 42 28 L 46 28" 
          stroke="#10B981" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
