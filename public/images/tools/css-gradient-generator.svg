<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cssGradBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient -->
    <linearGradient id="cssGradBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Vibrant Multicolor Preview Mesh Gradient -->
    <linearGradient id="vibrantMesh" x1="32" y1="36" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Linear Slider Rail Gradient -->
    <linearGradient id="sliderRailGrad" x1="36" y1="84" x2="92" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="gradGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="gradSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#A855F7" opacity="0.18" filter="url(#gradGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#cssGradBg)" stroke="url(#cssGradBorder)" stroke-width="1.5"/>

  <!-- Gradient Canvas / Swatch Preview Sphere -->
  <circle cx="64" cy="52" r="24" fill="url(#vibrantMesh)" filter="url(#gradSoftGlow)"/>

  <!-- Outer Ring (Angle Wheel Indicator) -->
  <circle cx="64" cy="52" r="28" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Angle Pointer Axis Line (135deg Gradient Vector) -->
  <line x1="47" y1="35" x2="81" y2="69" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.7"/>

  <!-- Gradient Stop Handle 1 (Cyan / Start Stop) -->
  <circle cx="47" cy="35" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.6" filter="url(#gradSoftGlow)"/>

  <!-- Gradient Stop Handle 2 (Pink / End Stop) -->
  <circle cx="81" cy="69" r="4" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.6" filter="url(#gradSoftGlow)"/>

  <!-- CSS Code Bracket Mini Badge (Top-Left) -->
  <rect x="26" y="24" width="18" height="12" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <!-- Mini CSS Curf: {} -->
  <path d="M 31 27 C 30 27, 29.5 28.5, 29.5 30 C 29.5 31.5, 30 33, 31 33" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
  <path d="M 39 27 C 40 27, 40.5 28.5, 40.5 30 C 40.5 31.5, 40 33, 39 33" stroke="#F472B6" stroke-width="1" stroke-linecap="round"/>

  <!-- Bottom Color Stop Slider Bar -->
  <rect x="34" y="87" width="60" height="4" rx="2" fill="url(#sliderRailGrad)"/>

  <!-- Slider Stop Pointers / Thumbs -->
  <!-- Left Thumb (Cyan) -->
  <path d="M 38 84 L 42 84 L 40 88 Z" fill="#FFFFFF"/>
  <circle cx="40" cy="94" r="3.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Mid Thumb (Violet) -->
  <path d="M 62 84 L 66 84 L 64 88 Z" fill="#FFFFFF"/>
  <circle cx="64" cy="94" r="3.2" fill="#A855F7" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Right Thumb (Coral Amber) -->
  <path d="M 86 84 L 90 84 L 88 88 Z" fill="#FFFFFF"/>
  <circle cx="88" cy="94" r="3.2" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Mini Sparkle Accent (Top-Right) -->
  <path d="M 99 24 
           Q 99 29, 104 29 
           Q 99 29, 99 34 
           Q 99 29, 94 29 
           Q 99 29, 99 24 Z" 
        fill="#F472B6" 
        opacity="0.85"
        filter="url(#gradSoftGlow)"/>
</svg>
