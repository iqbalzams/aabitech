<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="charBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient -->
    <linearGradient id="charBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Letter 'A' Gradient -->
    <linearGradient id="letterGrad" x1="32" y1="36" x2="68" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Counter Odometer / Gauge Gradient -->
    <linearGradient id="counterGrad" x1="68" y1="62" x2="102" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Text Cursor Gradient -->
    <linearGradient id="cursorGrad" x1="64" y1="36" x2="64" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="charGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="charSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#06B6D4" opacity="0.16" filter="url(#charGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#charBg)" stroke="url(#charBorder)" stroke-width="1.5"/>

  <!-- Document / Paragraph Stream Lines (Background Context) -->
  <rect x="30" y="32" width="28" height="3" rx="1.5" fill="#334155" opacity="0.8"/>
  <rect x="30" y="39" width="38" height="3" rx="1.5" fill="#334155" opacity="0.5"/>

  <!-- Primary Glyph: Bold Typographic 'A' (The "Character") -->
  <g filter="url(#charSoftGlow)">
    <!-- Left Leg -->
    <path d="M 46 84 L 54 44 L 62 84" 
          stroke="url(#letterGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Crossbar -->
    <line x1="49.5" y1="71" x2="58.5" y2="71" 
          stroke="#E2E8F0" 
          stroke-width="3.5" 
          stroke-linecap="round"/>
  </g>

  <!-- Text Input Blinking Cursor Indicator -->
  <line x1="68" y1="44" x2="68" y2="68" stroke="url(#cursorGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#charSoftGlow)"/>

  <!-- Character Count Counter / HUD Meter Pill -->
  <g filter="url(#charSoftGlow)">
    <rect x="62" y="66" width="42" height="26" rx="8" fill="#0B0D17" stroke="url(#counterGrad)" stroke-width="1.8"/>
    
    <!-- Top Tiny Counter Label: 'LEN' / '123' Tag -->
    <text x="0" y="0" fill="none"/>
    <!-- Numeric Counter Digits: '1' '2' '8' Handcrafted Vectors -->
    <!-- Digit 1 -->
    <path d="M 70 76.5 L 72.5 75 L 72.5 84" 
          stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Digit 2 -->
    <path d="M 78 76.5 C 78 74.8, 80 74.5, 81.5 75.5 C 82.5 76.5, 82.5 77.8, 81 79.5 L 78 84 L 83.5 84" 
          stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Digit 8 -->
    <path d="M 90 77.2 C 90 76, 88.5 75, 87 75 C 85.5 75, 84 76, 84 77.2 C 84 78.5, 85 79.2, 87 79.5 C 89 79.8, 90.2 80.5, 90.2 82 C 90.2 83.5, 88.8 84.5, 87 84.5 C 85.2 84.5, 83.8 83.5, 83.8 82 M 84 77.2 C 84 78.5, 85.2 79.2, 87 79.5 C 88.8 79.8, 90 80.5, 90 82" 
          stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Progress / Quota Ring Mini Arc (Top-Right) -->
  <g filter="url(#charSoftGlow)">
    <circle cx="98" cy="34" r="8" stroke="#334155" stroke-width="2" fill="none"/>
    <!-- 75% Completion Arc -->
    <path d="M 98 26 A 8 8 0 1 1 90 34" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="34" r="2" fill="#34D399"/>
  </g>

  <!-- Precision Measurement Ticks (Bottom-Left) -->
  <line x1="30" y1="88" x2="30" y2="84" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="36" y1="88" x2="36" y2="85" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="88" x2="42" y2="84" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="88" x2="48" y2="85" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="54" y1="88" x2="54" y2="84" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="88" x2="54" y2="88" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
</svg>
