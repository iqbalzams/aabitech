<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="slugBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Emerald to Cyan) -->
    <linearGradient id="slugBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Hyphen / Connector Gradient -->
    <linearGradient id="hyphenGrad" x1="50" y1="62" x2="78" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- URL Bar Stroke Gradient -->
    <linearGradient id="urlBarGrad" x1="24" y1="50" x2="104" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Transformation Arrow Gradient -->
    <linearGradient id="transArrow" x1="64" y1="36" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="slugGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="slugSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#10B981" opacity="0.16" filter="url(#slugGlow)"/>

  <!-- Base App Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#slugBg)" stroke="url(#slugBorder)" stroke-width="1.5"/>

  <!-- Top Raw Input Preview: "Title String With Spaces & Capital" -->
  <g opacity="0.75">
    <!-- Unformatted Capitalized Word 1 -->
    <rect x="30" y="32" width="18" height="5" rx="2" fill="#94A3B8"/>
    <!-- Unformatted Capitalized Word 2 -->
    <rect x="52" y="32" width="22" height="5" rx="2" fill="#94A3B8"/>
    <!-- Unformatted Capitalized Word 3 -->
    <rect x="78" y="32" width="16" height="5" rx="2" fill="#64748B"/>
  </g>

  <!-- Clean Downward Transformation Arrow (Normalize + Lowercase) -->
  <path d="M 64 40 L 64 47 M 60.5 44 L 64 47.5 L 67.5 44" 
        stroke="url(#transArrow)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#slugSoftGlow)"/>

  <!-- Primary Slug URL Pill Container -->
  <rect x="24" y="52" width="80" height="26" rx="8" 
        fill="#0B0D17" 
        stroke="url(#urlBarGrad)" 
        stroke-width="1.6" 
        filter="url(#slugSoftGlow)"/>

  <!-- Leading Slash / Protocol Indicator: "/" -->
  <line x1="31" y1="69" x2="35" y2="61" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Segment 1: Lowercase Word Token -->
  <rect x="39" y="62.5" width="15" height="5" rx="2.5" fill="#38BDF8"/>

  <!-- Connective Slug Hyphen 1: "-" (Glowing Primary Feature) -->
  <g filter="url(#slugSoftGlow)">
    <rect x="57" y="63" width="7" height="4" rx="2" fill="#34D399"/>
  </g>

  <!-- Segment 2: Lowercase Word Token -->
  <rect x="67" y="62.5" width="17" height="5" rx="2.5" fill="#38BDF8"/>

  <!-- Connective Slug Hyphen 2: "-" (Glowing Primary Feature) -->
  <g filter="url(#slugSoftGlow)">
    <rect x="87" y="63" width="7" height="4" rx="2" fill="#34D399"/>
  </g>

  <!-- Segment 3: Lowercase Word Token end snippet -->
  <rect x="97" y="62.5" width="3" height="5" rx="1.5" fill="#38BDF8" opacity="0.6"/>

  <!-- Bottom Interactive SEO / URL Link Badge -->
  <g filter="url(#slugSoftGlow)">
    <!-- Browser Link Chain Accent (Bottom-Left) -->
    <circle cx="34" cy="88" r="6.5" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
    <path d="M 32 88 H 36 M 34 86 V 90" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- SEO / Web-Safe Tag Pill (Bottom-Right) -->
    <rect x="46" y="82" width="52" height="13" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Mini "SEO SAFE" Indicator Dots & Vectors -->
    <circle cx="53" cy="88.5" r="2" fill="#10B981"/>
    <!-- Simulated clean path text "my-clean-slug" -->
    <line x1="58" y1="88.5" x2="68" y2="88.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="71" y1="88.5" x2="74" y2="88.5" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="77" y1="88.5" x2="88" y2="88.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="91" y1="88.5" x2="94" y2="88.5" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Accent (Top-Right) -->
  <path d="M 98 24 
           Q 98 28, 102 28 
           Q 98 28, 98 32 
           Q 98 28, 94 28 
           Q 98 28, 98 24 Z" 
        fill="#34D399" 
        opacity="0.85"
        filter="url(#slugSoftGlow)"/>
</svg>
