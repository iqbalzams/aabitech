<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="twBitsBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient (Twitch Violet to Emerald to Cyan) -->
    <linearGradient id="twBitsBorder" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9146FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Twitch Diamond Gem Gradient (Top/Front Faces) -->
    <linearGradient id="gemTop" x1="44" y1="28" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9146FF"/>
    </linearGradient>

    <linearGradient id="gemLeft" x1="28" y1="44" x2="44" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="gemRight" x1="44" y1="44" x2="60" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- USD Currency Coin Gradient -->
    <linearGradient id="usdCoinGrad" x1="72" y1="36" x2="104" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Conversion Flow Vector Gradient -->
    <linearGradient id="convFlow" x1="56" y1="52" x2="74" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Payout Result Badge Gradient -->
    <linearGradient id="payoutPillGrad" x1="24" y1="76" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9146FF"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="twBitsGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="twBitsSoftGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Container -->
  <rect x="24" y="20" width="80" height="88" rx="24" fill="#9146FF" opacity="0.16" filter="url(#twBitsGlow)"/>

  <!-- Base Glassmorphic Card -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#twBitsBg)" stroke="url(#twBitsBorder)" stroke-width="1.5"/>

  <!-- ================= Twitch Bits Gem (Origin: Left) ================= -->
  <g filter="url(#twBitsSoftGlow)">
    <!-- Top Apex Triangle -->
    <polygon points="44,28 58,42 30,42" fill="url(#gemTop)" stroke="#D8B4FE" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Left Inverted Facet -->
    <polygon points="30,42 44,42 44,66" fill="url(#gemLeft)" stroke="#A855F7" stroke-width="1" stroke-linejoin="round"/>

    <!-- Right Inverted Facet -->
    <polygon points="44,42 58,42 44,66" fill="url(#gemRight)" stroke="#C084FC" stroke-width="1" stroke-linejoin="round"/>

    <!-- Inner Core Gleam -->
    <line x1="44" y1="33" x2="44" y2="42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="44" cy="42" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Bits Value Counter Pip (e.g. 100 Bits Tag) -->
  <g opacity="0.85">
    <rect x="26" y="68" width="36" height="6" rx="3" fill="#1E1B4B" stroke="#7C3AED" stroke-width="0.8"/>
    <circle cx="31" cy="71" r="1.4" fill="#C084FC"/>
    <line x1="35" y1="71" x2="43" y2="71" stroke="#E2E8F0" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="46" y1="71" x2="57" y2="71" stroke="#A855F7" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- ================= Exchange Rate Connector (1 Bit = $0.01) ================= -->
  <g filter="url(#twBitsSoftGlow)">
    <!-- Wave Conversion Track -->
    <path d="M 58 46 C 62 43, 66 49, 70 46" 
          stroke="url(#convFlow)" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Main Exchange Arrow -->
    <path d="M 59 54 L 71 54 M 68 51.5 L 71.5 54 L 68 56.5" 
          stroke="#34D399" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ================= USD Currency Coin (Target: Right) ================= -->
  <g filter="url(#twBitsSoftGlow)">
    <!-- Outer Rim -->
    <circle cx="88" cy="48" r="16" fill="#0B0D17" stroke="#10B981" stroke-width="2"/>
    <circle cx="88" cy="48" r="13" fill="url(#usdCoinGrad)" stroke="#34D399" stroke-width="1.2" opacity="0.9"/>

    <!-- High-Contrast '$' Dollar Glyph -->
    <path d="M 90.5 44 C 90 42.8, 88.8 42.2, 87.2 42.2 C 85.5 42.2, 84.5 43.2, 84.5 44.5 C 84.5 46.2, 86.2 46.8, 88.5 47.5 C 90.8 48.2, 91.8 49.2, 91.8 51 C 91.8 52.8, 90.2 53.8, 88.2 53.8 C 86.5 53.8, 85.2 53, 84.5 51.8" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="88" y1="40.5" x2="88" y2="55.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- ================= Payout & Conversion Readout HUD ================= -->
  <g filter="url(#twBitsSoftGlow)">
    <rect x="24" y="76" width="80" height="24" rx="7" fill="#0B0D17" stroke="url(#payoutPillGrad)" stroke-width="1.4"/>

    <!-- Twitch Streamer Tier / Payout Check Indicator -->
    <circle cx="34" cy="88" r="4.5" fill="#9146FF" fill-opacity="0.25" stroke="#A855F7" stroke-width="1.2"/>
    <path d="M 32.5 88 L 33.8 89.3 L 36 87" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Handcrafted Result Vector: "$1.00 USD" -->
    <!-- '$' -->
    <path d="M 44.5 86 C 44.2 85.4, 43.5 85, 42.6 85 C 41.6 85, 41 85.5, 41 86.2 C 41 87.2, 42 87.5, 43.2 88 C 44.5 88.5, 45 89, 45 90 C 45 91, 44 91.5, 43 91.5 C 42 91.5, 41.2 91, 40.8 90.5" 
          stroke="#34D399" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="42.8" y1="84" x2="42.8" y2="92.5" stroke="#34D399" stroke-width="1" stroke-linecap="round"/>

    <!-- '1' -->
    <line x1="48" y1="86" x2="49.5" y2="85" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="49.5" y1="85" x2="49.5" y2="91" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- '.' -->
    <circle cx="52.5" cy="91" r="0.8" fill="#34D399"/>

    <!-- '0' -->
    <ellipse cx="56.5" cy="88" rx="2" ry="3" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- '0' -->
    <ellipse cx="62.5" cy="88" rx="2" ry="3" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Unit Label Pill: "USD" -->
    <rect x="68" y="82.5" width="28" height="11" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <!-- 'U' -->
    <path d="M 73 85 V 88 C 73 89.2, 75 89.2, 75 88 V 85" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 'S' -->
    <path d="M 79.5 85.5 C 79 85, 78 85, 78 85.8 C 78 86.8, 80 86.8, 80 87.8 C 80 88.8, 79 88.8, 78.2 88.5" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 'D' -->
    <path d="M 83 85 V 89 H 84.5 C 85.8 89, 86.5 88.2, 86.5 87 C 86.5 85.8, 85.8 85, 84.5 85 Z" stroke="#38BDF8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Twitch Violet Sparkle (Top-Right) -->
  <path d="M 102 21 
           Q 102 25, 106 25 
           Q 102 25, 102 29 
           Q 102 25, 98 25 
           Q 102 25, 102 21 Z" 
        fill="#9146FF" 
        filter="url(#twBitsSoftGlow)"/>

  <!-- Live Bit Spark (Top-Left) -->
  <circle cx="28" cy="27" r="1.8" fill="#38BDF8" opacity="0.8"/>
</svg>
